name = "opencv_features_examples"
description = "Examples for the OpenCV Features Ada binding"
version = "0.1.0-dev"
authors = ["Zack Boll"]
maintainers = ["Zack Boll <zackboll@gmail.com>"]
maintainers-logins = ["zackboll"]
licenses = "Apache-2.0"

project-files = ["opencv_features_examples.gpr"]
executables = ["orb_synthetic", "orb_match_synthetic"]

[[depends-on]]
opencv_features = "*"

[[pins]]
opencv_features = { path = ".." }
opencv_core = { url = "https://github.com/zackboll/opencv_core_ada.git", commit = "386c5360ac51f2b62e522853d94290aec4ee14a0" }

[build-switches."*"]
ada_version = "Ada2022"
style_checks = "No"
