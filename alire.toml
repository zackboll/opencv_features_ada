name = "opencv_features"
description = "Thick Ada binding to OpenCV feature detection and description"
version = "0.1.0-dev"
authors = ["Zack Boll"]
maintainers = ["Zack Boll <zackboll@gmail.com>"]
maintainers-logins = ["zackboll"]
licenses = "Apache-2.0"

website = "https://github.com/zackboll/opencv_features_ada"
tags = ["opencv", "computer-vision", "binding", "ada"]
project-files = ["opencv_features.gpr"]

[[depends-on]]
opencv_core = "~0.5.0"
opencv = "*"
pkg_config = "*"

# Core resolves from the Alire community index. Do not reintroduce a Git pin.
# tests/ and examples/ are separate Alire roots and pin only this crate by path.

[depends-on.'case(os)'.windows]
mingw_w64_gcc = "*"

[environment.'case(distribution)']
msys2 = { PATH.prepend = "${CRATE_ROOT}/lib" }

[build-switches."*"]
ada_version = "Ada2022"
style_checks = "No"

[[actions]]
type = "pre-build"
command = ["sh", "scripts/configure_opencv.sh"]

[[actions]]
type = "test"
command = ["sh", "scripts/test.sh"]
