name: Windows post-merge Features
on:
  push:
    branches:
      - main
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: alire-project/setup-alire@latest
        with:
          version: "2.1.1"
          toolchain: "gnat_native gprbuild"
          msys2: true
      - name: Select Ada toolchain
        run: alr -n --force toolchain --select gnat_native=16.1.0 gprbuild=26.0.1
      # MSYS2 supports full upgrades only. Keep the parent outside managed
      # MSYS2 so a core runtime update can finish before a fresh invocation.
      # https://www.msys2.org/docs/updating/ and /docs/ci/
      - name: Upgrade Alire-managed MSYS2 core
        shell: pwsh
        run: |
          alr -n exec -- pacman -Syu --noconfirm
          if ($LASTEXITCODE -ne 0) { throw "MSYS2 core upgrade failed: $LASTEXITCODE" }
      - name: Complete Alire-managed MSYS2 full upgrade
        shell: pwsh
        run: |
          alr -n exec -- pacman -Syu --noconfirm
          if ($LASTEXITCODE -ne 0) { throw "MSYS2 full upgrade failed: $LASTEXITCODE" }
      - name: Install MSYS2 native dependencies
        shell: pwsh
        run: |
          alr -n exec -- pacman -S --noconfirm --needed mingw-w64-x86_64-opencv mingw-w64-x86_64-pkg-config mingw-w64-x86_64-gcc
          if ($LASTEXITCODE -ne 0) { throw "MSYS2 native dependency installation failed: $LASTEXITCODE" }
          alr -n exec -- pacman -Dk
          if ($LASTEXITCODE -ne 0) { throw "MSYS2 package dependency consistency check failed: $LASTEXITCODE" }
      - name: Build and run with isolated native runtime
        run: sh scripts/test.sh
      - name: Regress real Alire environment hashing (not native qualification)
        env:
          FEATURES_REAL_ALIRE_TEST: "1"
        run: alr -n exec -- python -m unittest discover -s tests/configuration -p test_alire_environment_real.py -v
      - name: Qualify Windows production and fault native boundaries
        run: sh scripts/run_windows_native_boundary.sh . obj/windows-native-boundary
      - name: Qualify immutable 0.1.0 release native boundaries
        run: sh scripts/qualify_windows_release.sh obj/windows-release-boundary
      - name: Preserve Windows native-boundary diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-native-boundary-${{ github.sha }}
          retention-days: 14
          if-no-files-found: error
          # Reports and diagnostics only; no executables, objects or environment dumps.
          path: |
            obj/windows-native-boundary/**/*.log
            obj/windows-native-boundary/qualification.json
            obj/windows-release-boundary/**/*.log
            obj/windows-release-boundary/qualification.json
      - name: Inspect external Features DLL
        run: |
          set -eu
          test -f lib/libopencv_features_shim.dll
          test -f lib/libopencv_features_shim.dll.a
          test ! -f lib/libopencv_features_shim.a
          driver=$(sed -n 's/^[ ]*Cxx_Driver := "\(.*\)";/\1/p' config/opencv_features_install.gpr)
          case "$driver" in
            *gnat_native*) exit 1 ;;
            *mingw64*/bin/g++*) ;;
            *) echo "error: expected MSYS2 MinGW64 g++, got $driver" >&2; exit 1 ;;
          esac
          for setting in OpenCV_Features_Link_Option OpenCV_Core_Link_Option Core_Shim_Link_Option; do
            import_library=$(sed -n "s/^[ ]*$setting := \"\(.*\)\";/\1/p" config/opencv_features_install.gpr)
            test -f "$import_library"
          done
          "$(dirname "$driver")/objdump.exe" -p lib/libopencv_features_shim.dll > features-pe.log
          grep -i 'DLL Name.*opencv_features' features-pe.log
          grep -i 'DLL Name.*opencv_core_shim' features-pe.log
      - name: External shim GPRinstall regressions
        run: alr -n exec -- python tests/test_external_shim_install.py -v
      - name: Qualify source installed and relocated consumers (post-merge only)
        id: consumer
        run: sh scripts/validate_clean_consumer.sh
      - name: Preserve failed consumer resolution evidence
        if: ${{ failure() && steps.consumer.outcome == 'failure' && steps.consumer.outputs.evidence-directory != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: windows-consumer-resolution-${{ github.sha }}
          retention-days: 14
          if-no-files-found: error
          # Deliberately exclude printenv, PATH inventories, caches and binaries.
          path: |
            ${{ steps.consumer.outputs.evidence-directory }}/installed-projects.log
            ${{ steps.consumer.outputs.evidence-directory }}/installed-build.log
            ${{ steps.consumer.outputs.evidence-directory }}/installed-resolution.log
            ${{ steps.consumer.outputs.evidence-directory }}/install.log
            ${{ steps.consumer.outputs.evidence-directory }}/relocated-projects.log
            ${{ steps.consumer.outputs.evidence-directory }}/relocated-build.log
            ${{ steps.consumer.outputs.evidence-directory }}/relocated-resolution.log
            ${{ steps.consumer.outputs.evidence-directory }}/path-audit-failure.log
            ${{ steps.consumer.outputs.evidence-directory }}/relocated-longer-prefix-b/share/gpr/**/*.gpr
            ${{ steps.consumer.outputs.evidence-directory }}/prefix-a/share/gpr/**/*.gpr
