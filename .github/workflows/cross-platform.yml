name: Cross-platform Features
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  repository-checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Repository and configuration tests (no OpenCV required)
        run: |
          python3 scripts/check_repository.py
          python3 -m unittest discover -s tests/configuration -v
          sh scripts/run_profile_tests.sh
          for script in scripts/*.sh; do sh -n "$script"; done
          git diff --check
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ pkg-config libopencv-dev
      - uses: alire-project/setup-alire@latest
        with:
          version: "2.1.1"
          toolchain: "gnat_native gprbuild"
      - name: Select Ada toolchain
        run: alr -n --force toolchain --select gnat_native=16.1.0 gprbuild=26.0.1
      - name: Record native and compiler versions
        run: |
          for package in opencv5 opencv4 opencv; do
            if pkg-config --exists "$package"; then pkg-config --modversion "$package"; break; fi
          done
          g++ --version
          alr toolchain
      - name: Build and run native AUnit suite
        run: sh scripts/test.sh
      - name: External shim GPRinstall regressions (synthetic artifacts)
        run: alr -n exec -- python3 tests/test_external_shim_install.py -v
      - name: Build and run example
        run: |
          alr -n -C examples build
          alr -n -C examples exec -- sh ../scripts/run_native.sh bin/orb_synthetic
          alr -n -C examples exec -- sh ../scripts/run_native.sh bin/orb_match_synthetic
      - name: Qualify source installed and relocated consumers
        run: sh scripts/validate_clean_consumer.sh
  linux-sanitizers:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ pkg-config libopencv-dev
      - uses: alire-project/setup-alire@latest
        with:
          version: "2.1.1"
          toolchain: "gnat_native gprbuild"
      - name: Select Ada toolchain
        run: alr -n --force toolchain --select gnat_native=16.1.0 gprbuild=26.0.1
      - name: Instrument actual Features shim and exercise native boundary
        run: |
          alr -n build
          alr -n exec -- g++ --version
          alr -n exec -- sh scripts/run_sanitizers.sh
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Install native dependencies
        run: brew install opencv pkg-config
      - uses: alire-project/setup-alire@latest
        with:
          version: "2.1.1"
          toolchain: "gnat_native gprbuild"
      - name: Select Ada toolchain
        run: alr -n --force toolchain --select gnat_native=16.1.0 gprbuild=26.0.1
      - name: Record native and compiler versions
        run: |
          for package in opencv5 opencv4 opencv; do
            if pkg-config --exists "$package"; then pkg-config --modversion "$package"; break; fi
          done
          xcrun clang++ --version
          alr toolchain
      - name: Build and run native AUnit suite
        run: sh scripts/test.sh
      - name: Verify C++ runtime boundary
        run: |
          set -eu
          dylib=$(find lib -name '*opencv_features_shim*.dylib' -print -quit)
          test -n "$dylib"
          otool -L "$dylib" | tee /tmp/features-linkage.txt
          grep -E 'libopencv_features(2d)?\.' /tmp/features-linkage.txt
          grep -E 'libopencv_core_shim' /tmp/features-linkage.txt
          grep -E 'libc\+\+' /tmp/features-linkage.txt
          if grep -E 'libstdc\+\+' /tmp/features-linkage.txt; then exit 1; fi
      - name: External shim GPRinstall regressions (synthetic artifacts)
        run: alr -n exec -- python3 tests/test_external_shim_install.py -v
      - name: Qualify source installed and relocated consumers
        run: sh scripts/validate_clean_consumer.sh

  # Branch-only numerical research. Existing production jobs remain untouched.
  orb-r3-macos-numerics:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/research/011-r3-hosted-numerics' }}
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Install native research dependencies
        run: brew install opencv pkg-config
      - name: Record package identity
        run: |
          mkdir -p r3-evidence
          brew info --json=v2 opencv > r3-evidence/homebrew-opencv.log
      - name: Run numerical research (O0, O2, O3)
        run: sh docs/research/run_orb_r3.sh r3-evidence
      - name: Preserve focused evidence even after failure
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: orb-r3-macos-numerics-${{ github.sha }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            r3-evidence/**/*.log
            r3-evidence/**/*.txt
            r3-evidence/manifest.json
  orb-r3-windows-numerics:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/research/011-r3-hosted-numerics' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: alire-project/setup-alire@latest
        with:
          version: "2.1.1"
          toolchain: "gnat_native gprbuild"
          msys2: true
      - name: Select Ada toolchain
        shell: bash
        run: alr -n --force toolchain --select gnat_native=16.1.0 gprbuild=26.0.1
      # Same two-stage full upgrade as Windows post-merge; no partial upgrade.
      - name: Upgrade Alire-managed MSYS2 core
        shell: pwsh
        run: |
          alr -n exec -- pacman -Syu --noconfirm
          if ($LASTEXITCODE -ne 0) { throw "MSYS2 core upgrade failed: $LASTEXITCODE" }
      - name: Complete Alire-managed MSYS2 full upgrade
        shell: pwsh
        run: |
          alr -n exec -- pacman -Syu --noconfirm
          if ($LASTEXITCODE -ne 0) { throw "MSYS2 full upgrade failed: $LASTEXITCODE" }
      - name: Install managed native research dependencies
        shell: pwsh
        run: |
          alr -n exec -- pacman -S --noconfirm --needed mingw-w64-x86_64-opencv mingw-w64-x86_64-pkg-config mingw-w64-x86_64-gcc mingw-w64-x86_64-python
          if ($LASTEXITCODE -ne 0) { throw "MSYS2 dependency installation failed: $LASTEXITCODE" }
          alr -n exec -- pacman -Dk
          if ($LASTEXITCODE -ne 0) { throw "MSYS2 dependency consistency failed: $LASTEXITCODE" }
      - name: Run managed MinGW64 numerical research (O0, O2, O3)
        shell: pwsh
        run: |
          alr -n exec -- sh docs/research/run_orb_r3.sh r3-evidence
          if ($LASTEXITCODE -ne 0) { throw "Numerical research failed: $LASTEXITCODE" }
      - name: Preserve focused evidence even after failure
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: orb-r3-windows-numerics-${{ github.sha }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            r3-evidence/**/*.log
            r3-evidence/**/*.txt
            r3-evidence/manifest.json

  # Branch-only installed-ORB correspondence. R3 numerical jobs stay on their branch.
  orb-r3e-macos-native:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/research/011-r3e-native-correspondence' }}
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Install native research dependencies
        run: brew install opencv pkg-config
      - name: Record installed ORB correspondence
        run: sh docs/research/run_orb_r3e.sh r3e-evidence
      - name: Preserve focused evidence even after failure
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: orb-r3e-macos-native-${{ github.sha }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            r3e-evidence/**/*.log
            r3e-evidence/**/*.txt
            r3e-evidence/manifest.json
  orb-r3e-windows-native:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/research/011-r3e-native-correspondence' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: alire-project/setup-alire@latest
        with:
          version: "2.1.1"
          toolchain: "gnat_native gprbuild"
          msys2: true
      - name: Select Ada toolchain
        shell: bash
        run: alr -n --force toolchain --select gnat_native=16.1.0 gprbuild=26.0.1
      - name: Upgrade Alire-managed MSYS2 core
        shell: pwsh
        run: |
          alr -n exec -- pacman -Syu --noconfirm
          if ($LASTEXITCODE -ne 0) { throw "MSYS2 core upgrade failed: $LASTEXITCODE" }
      - name: Complete Alire-managed MSYS2 full upgrade
        shell: pwsh
        run: |
          alr -n exec -- pacman -Syu --noconfirm
          if ($LASTEXITCODE -ne 0) { throw "MSYS2 full upgrade failed: $LASTEXITCODE" }
      - name: Install managed native research dependencies
        shell: pwsh
        run: |
          alr -n exec -- pacman -S --noconfirm --needed mingw-w64-x86_64-opencv mingw-w64-x86_64-pkg-config mingw-w64-x86_64-gcc mingw-w64-x86_64-python
          if ($LASTEXITCODE -ne 0) { throw "MSYS2 dependency installation failed: $LASTEXITCODE" }
          alr -n exec -- pacman -Dk
          if ($LASTEXITCODE -ne 0) { throw "MSYS2 dependency consistency failed: $LASTEXITCODE" }
      - name: Record installed ORB correspondence
        shell: pwsh
        run: |
          alr -n exec -- sh docs/research/run_orb_r3e.sh r3e-evidence
          if ($LASTEXITCODE -ne 0) { throw "Native correspondence research failed: $LASTEXITCODE" }
      - name: Preserve focused evidence even after failure
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: orb-r3e-windows-native-${{ github.sha }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            r3e-evidence/**/*.log
            r3e-evidence/**/*.txt
            r3e-evidence/manifest.json
